<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rina Love TKR & LISTRIK</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            position: relative;
        }

        /* Hati berlompat di atas */
        .hearts-container {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
        }

        .heart {
            font-size: 35px;
            animation: bounceHeart 0.7s ease-in-out infinite alternate;
        }

        .heart:nth-child(1) { animation-delay: 0s; }
        .heart:nth-child(2) { animation-delay: 0.12s; }
        .heart:nth-child(3) { animation-delay: 0.24s; }
        .heart:nth-child(4) { animation-delay: 0.36s; }
        .heart:nth-child(5) { animation-delay: 0.48s; }

        @keyframes bounceHeart {
            0% {
                transform: translateY(0) scale(1);
            }
            100% {
                transform: translateY(-35px) scale(1.15);
            }
        }

        /* Teks utama */
        .teks-cinta {
            font-size: 2.3rem;
            font-weight: bold;
            color: #d63031;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            text-align: center;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        /* Wadah karakter */
        .anime-container {
            position: relative;
            width: 220px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: lompatKarakter 0.65s ease-in-out infinite alternate;
        }

        /* Elemen Video Animasi */
        .anime-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 15px;
            animation: goyang 0.6s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }

        /* Animasi lompat */
        @keyframes lompatKarakter {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-45px);
            }
        }

        /* Animasi goyang kanan-kiri */
        @keyframes goyang {
            0% {
                transform: rotate(-5deg);
            }
            100% {
                transform: rotate(5deg);
            }
        }

        /* Hati kecil di dekat video */
        .hati-kecil {
            position: absolute;
            top: 20px;
            right: 10px;
            font-size: 28px;
            animation: denyut 0.45s ease-in-out infinite alternate;
            z-index: 2;
        }

        @keyframes denyut {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.35);
            }
        }

        /* Efek bintang kecil */
        .stars {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }

        .star {
            font-size: 18px;
            color: #fff;
            animation: denyut 0.5s ease-in-out infinite alternate;
        }

        .star:nth-child(2) { animation-delay: 0.1s; }
        .star:nth-child(3) { animation-delay: 0.2s; }
    </style>
</head>
<body>

    <!-- Hati berlompat di atas -->
    <div class="hearts-container">
        <span class="heart">❤️</span>
        <span class="heart">💕</span>
        <span class="heart">💖</span>
        <span class="heart">💗</span>
        <span class="heart">❤️</span>
    </div>

    <!-- Tulisan -->
    <h1 class="teks-cinta">rina love semua anak-anak TKR & LISTRIK</h1>

    <!-- Karakter video anime -->
    <div class="anime-container">
        <video class="anime-video" autoplay loop muted playsinline>
            <source src="https://files.catbox.moe/l0fv1e.mp4" type="video/mp4">
            Browser Anda tidak mendukung tag video.
        </video>
        <span class="hati-kecil">❤️</span>
    </div>

    <!-- Bintang efek -->
    <div class="stars">
        <span class="star">✨</span>
        <span class="star">✨</span>
        <span class="star">✨</span>
    </div>

</body>
</html>
